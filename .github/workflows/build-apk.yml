name: Bridge checks and APK
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_dji:
        description: 'Build DJI-enabled APK using the repository DJI_API_KEY secret'
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  desktop-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Desktop contracts, real loopback UDP, database and replay tests
        shell: pwsh
        run: |
          npm test *> desktop-tests.log
          $result = $LASTEXITCODE
          Get-Content desktop-tests.log
          exit $result
      - run: npm ci --prefix client
      - run: npm run build --prefix client
      - name: Real Electron UI, UDP, recording and replay smoke
        shell: pwsh
        run: |
          npm run test:desktop *> desktop-smoke.log
          $result = $LASTEXITCODE
          Get-Content desktop-smoke.log
          exit $result
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-test-results
          path: |
            desktop-tests.log
            desktop-smoke.log
            test-results/
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
          log-accepted-android-sdk-licenses: false
      - name: Build and test network-only APK (cannot register with DJI)
        working-directory: android-dji-bridge
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug -PnetworkOnly --no-daemon --console=plain 2>&1 | tee ../android-build.log
      - name: Verify packaged manifest and checksum
        run: |
          python scripts/verify_apk.py android-dji-bridge/app/build/outputs/apk/debug/app-debug.apk --network-only
          sha256sum android-dji-bridge/app/build/outputs/apk/debug/app-debug.apk > network-apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: network-test-apk-and-reports
          path: |
            android-build.log
            network-apk.sha256
            android-dji-bridge/app/build/outputs/apk/debug/*.apk
            android-dji-bridge/app/build/reports/
            android-dji-bridge/app/build/test-results/
  dji-apk:
    if: github.event_name == 'workflow_dispatch' && inputs.build_dji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
          log-accepted-android-sdk-licenses: false
      - name: Build DJI-enabled APK
        working-directory: android-dji-bridge
        env:
          DJI_API_KEY: ${{ secrets.DJI_API_KEY }}
        run: |
          set -o pipefail
          if [ -z "$DJI_API_KEY" ]; then echo 'Owner must set repository secret DJI_API_KEY for com.sentinel.cop.dji.'; exit 1; fi
          chmod +x gradlew
          ./gradlew :app:assembleDebug :app:testDebugUnitTest :app:lintDebug --no-daemon --console=plain 2>&1 | tee ../dji-build.log
      - name: Check real-key manifest without printing key
        run: |
          python scripts/verify_apk.py android-dji-bridge/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android-dji-bridge/app/build/outputs/apk/debug/app-debug.apk > dji-apk.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dji-enabled-apk-and-reports
          path: |
            dji-build.log
            dji-apk.sha256
            android-dji-bridge/app/build/outputs/apk/debug/*.apk
            android-dji-bridge/app/build/reports/
            android-dji-bridge/app/build/test-results/
  android-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
          log-accepted-android-sdk-licenses: false
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x android-dji-bridge/gradlew
      - name: Launch Android app and test actual button, UDP and rotation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 28
          arch: x86
          target: default
          disable-animations: true
          script: bash scripts/run-android-ui.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-ui-reports
          path: |
            android-ui.log
            android-emulator-crashes.log
            android-dji-bridge/app/build/reports/androidTests/
            android-dji-bridge/app/build/outputs/androidTest-results/
