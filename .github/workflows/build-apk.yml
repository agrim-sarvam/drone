name: Build Sentinel DJI Bridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK and build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          set -o pipefail
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e\n84831b9409646a918e30573bab4c9c91346d8abd" > "$ANDROID_HOME/licenses/android-sdk-license" || true
          echo "sdk.dir=$ANDROID_HOME" > android-dji-bridge/local.properties
          chmod +x android-dji-bridge/gradlew
          cd android-dji-bridge
          ./gradlew :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee ../build.log

      - name: Report Build Error
        if: failure()
        run: |
          echo "### ❌ Build Failure Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -n 120 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git checkout -b build-logs || git checkout build-logs
          cp build.log build_error.txt
          git add build_error.txt
          git commit -m "chore: save build log" || true
          git push origin build-logs -f || true

      - name: Locate APK
        run: |
          APK_FILE=$(find android-dji-bridge/app/build -name "*.apk" | head -n 1)
          echo "Found APK: $APK_FILE"
          echo "### 📦 Built APK: \`$APK_FILE\`" >> $GITHUB_STEP_SUMMARY
          cp "$APK_FILE" ./Sentinel-DJI-Bridge.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-DJI-Bridge-APK
          path: ./Sentinel-DJI-Bridge.apk

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-apk
          name: "Sentinel DJI Bridge APK (v1.0.0)"
          body: "Direct download APK for Android phone connected to DJI Remote Controller (Air 2S / Mini / Mavic)."
          files: ./Sentinel-DJI-Bridge.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
