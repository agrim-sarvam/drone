name: Build Sentinel DJI Bridge APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Configure Android SDK and build APK
        env:
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m"
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android-dji-bridge/local.properties
          chmod +x android-dji-bridge/gradlew
          cd android-dji-bridge
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sentinel-DJI-Bridge-APK
          path: android-dji-bridge/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
