apply plugin: 'com.android.application'

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}
def djiApiKey = properties.getProperty('dji.api.key', 'MISSING_API_KEY')

android {
    compileSdkVersion 33
    defaultConfig {
        applicationId "com.sentinel.cop.dji"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        manifestPlaceholders = [djiApiKey: djiApiKey]
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    packagingOptions {
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        exclude 'META-INF/rxjava.properties'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    
    // DJI SDK V4
    implementation('com.dji:dji-sdk:4.16.2') {
        exclude module: 'library-anti-distortion'
        exclude module: 'fly-safe-database'
    }
    compileOnly 'com.dji:dji-sdk-provided:4.16.2'
}
