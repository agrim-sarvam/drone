apply plugin: 'com.android.application'

Properties properties = new Properties()
if (project.rootProject.file('local.properties').exists()) {
    properties.load(project.rootProject.file('local.properties').newDataInputStream())
}
def djiApiKey = System.getenv('DJI_API_KEY') ?: properties.getProperty('dji.api.key', '')
def networkOnly = project.hasProperty('networkOnly')
if (!networkOnly && (!djiApiKey || djiApiKey == 'MISSING_API_KEY')) {
    throw new GradleException('Set DJI_API_KEY or dji.api.key in local.properties. For network tests only, use -PnetworkOnly (DJI registration disabled).')
}

android {
    compileSdkVersion 33
    // Matches DJI's sample: parts of the SDK still reference the legacy Apache HTTP client.
    useLibrary 'org.apache.http.legacy'
    defaultConfig {
        applicationId "com.sentinel.cop.dji"
        minSdkVersion 23
        targetSdkVersion 33
        versionCode 4
        versionName "1.3.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        manifestPlaceholders = [djiApiKey: networkOnly ? 'NETWORK_TEST_ONLY' : djiApiKey,
                                bridgeLabel: networkOnly ? 'Sentinel Network Test' : 'Sentinel DJI Bridge']
        buildConfigField 'boolean', 'NETWORK_ONLY', networkOnly.toString()
        buildConfigField 'String', 'SOURCE_REVISION', '"' + (System.getenv('GITHUB_SHA') ?: 'local') + '"'
        if (networkOnly) {
            applicationIdSuffix '.networktest'
            versionNameSuffix '-network-test'
        }
    }
    signingConfigs {
        // Every CI runner otherwise generates its own debug key, so each new test APK fails to install over
        // the previous one ("App not installed") and testers must uninstall, losing DJI's cached registration.
        // This key uses the public debug credentials and is for test builds only, not a release identity.
        debug {
            storeFile file('sentinel-debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
    packagingOptions {
        // The DJI loader copies and loads its libraries from disk; AGP's default at minSdk 23+ (uncompressed,
        // not extracted) leaves the app hanging on a white screen (dji-sdk/Mobile-SDK-Android#876).
        jniLibs { useLegacyPackaging true }
        // Full list from DJI's 4.18 sample.
        doNotStrip "*/*/libdjivideo.so"
        doNotStrip "*/*/libSDKRelativeJNI.so"
        doNotStrip "*/*/libFlyForbid.so"
        doNotStrip "*/*/libduml_vision_bokeh.so"
        doNotStrip "*/*/libyuv2.so"
        doNotStrip "*/*/libGroudStation.so"
        doNotStrip "*/*/libFRCorkscrew.so"
        doNotStrip "*/*/libUpgradeVerify.so"
        doNotStrip "*/*/libFR.so"
        doNotStrip "*/*/libDJIFlySafeCore.so"
        doNotStrip "*/*/libdjifs_jni.so"
        doNotStrip "*/*/libsfjni.so"
        doNotStrip "*/*/libDJICommonJNI.so"
        doNotStrip "*/*/libDJICSDKCommon.so"
        doNotStrip "*/*/libDJIUpgradeCore.so"
        doNotStrip "*/*/libDJIUpgradeJNI.so"
        doNotStrip "*/*/libDJIWaypointV2Core.so"
        doNotStrip "*/*/libAMapSDK_MAP_v6_9_2.so"
        doNotStrip "*/*/libDJIMOP.so"
        doNotStrip "*/*/libDJISDKLOGJNI.so"
        exclude 'META-INF/rxjava.properties'
        exclude 'assets/location_map_gps_locked.png'
        exclude 'assets/location_map_gps_3d.png'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    lintOptions {
        abortOnError true
    }
    testOptions { unitTests.returnDefaultValues = true }
    sourceSets { test.resources.srcDirs += '../../tests/fixtures' }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    
    // DJI SDK V4. 4.18 is the last V4 release: DJI support states 4.16.x is not Android 13 compatible,
    // and 4.18 is tested against current Air 2S firmware (02.04.25.00). Air 2S is not supported by MSDK V5.
    implementation('com.dji:dji-sdk:4.18') {
        exclude module: 'library-anti-distortion'
        // fly-safe-database is kept: without it the SDK downloads it during registration, which fails offline.
    }
    compileOnly 'com.dji:dji-sdk-provided:4.18'
    // Runtime libraries DJI's 4.18 sample ships; the SDK's POM does not declare them.
    implementation 'com.squareup:otto:1.3.8'
    implementation 'androidx.lifecycle:lifecycle-common-java8:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.3.1'
    implementation 'androidx.lifecycle:lifecycle-process:2.3.1'
    implementation 'com.google.guava:guava:29.0-android'
    implementation 'org.apache.commons:commons-math3:3.6.1'
    implementation 'io.reactivex.rxjava2:rxjava:2.2.4'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.0'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
    androidTestImplementation 'androidx.test:runner:1.5.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
